name: Release

# Builds the IRIX irixscsitb binaries NATIVELY — both flavors compile inside
# the IRIS emulator on a real installed IRIX disk — then packages them into
# .iso / .hda / .tar.gz with rb-cli (rusty-backup) and publishes a GitHub
# release. docs/ci-iris.md is the full write-up; this file is meant to be
# readable as a sample for other IRIX projects.
#
# THIN YAML BY DESIGN: every step body is a one-line call into scripts/, and
# those same scripts are what scripts/release-local.sh runs on a developer
# machine — one code path, whether the release is built here or locally.
# The only things that live in YAML are the things only Actions can do:
# job topology + matrix, runner selection, mapping secrets/inputs into the
# environment, actions/cache + artifact transport, and runner apt packages.
#
#   scripts/fetch-iris.sh       prebuilt iris + iris-ci from the iris releases
#   scripts/ensure-rbcli.sh     rb-cli from PATH or its releases
#   scripts/fetch-image.sh      boot disk: local path / conf / URL download
#   scripts/iris-build.sh       the native build inside the emulator
#   scripts/package-dist.sh     package.sh args assembled from what was built
#   scripts/publish-release.sh  gh release create with the canonical set
#
# Artifacts produced:
#   irixscsitb-o32 / scsitbgui-o32   o32/mips2 CLI + Motif GUI (IRIX 5.3-6.5),
#                                    built in an IRIX 5.3 guest (single-user)
#   irixscsitb-n32 / scsitbgui-n32   n32/mips3 CLI + GUI (IRIX 6.x, faster),
#                                    built in an IRIX 6.5 guest (multiuser)
#   irixscsitb-*.iso                 IRIX EFS CD-ROM   -> IRIS `cdrom = true`
#   irixscsitb-*.hda                 dvh + EFS HDD     -> IRIS `cdrom = false`
#   irixscsitb-*.tar.gz              all binaries + README, for an NFS share
#
# REQUIRED CONFIG (Settings > Secrets and variables > Actions) — hosted mode:
#   secret IRIX53_DISK_URL   URL to an installed IRIX 5.3 boot disk with the
#                            IDO dev option — a bare `.chd` or a `.zip` with
#                            one. These are licensed IRIX installs: host them
#                            PRIVATELY (private release asset, S3 + token, …).
#   secret IRIX65_DISK_URL   same for an installed IRIX 6.5 disk with MIPSpro.
# Optional:
#   var IRIS_RELEASE_REPO    repo publishing prebuilt iris CLI releases
#                            [danifunker/iris]
#   var IRIS_TAG             iris release tag to pin [latest]
#   var BUILD_O32/BUILD_N32  durably disable a flavor ('false'/'0'); the
#                            build_o32/build_n32 dispatch inputs do it per-run.
#                            Only have one image? Turn the other flavor off —
#                            packaging adapts (an n32-only release notes that
#                            its media binaries are 6.x-only).
#
# SELF-HOSTED MODE (images never leave your machine): dispatch the workflow
# with `runner_label` set to your runner's label and `irix53_image` /
# `irix65_image` set to absolute paths of the .chd files on that runner.
# (Those inputs surface as $IRIX53_IMAGE/$IRIX65_IMAGE — the same variables
# the scripts honor locally.) Linux and macOS runners both work.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner label to build on (blank = ubuntu-latest; e.g. self-hosted)"
        required: false
        default: ""
      irix53_image:
        description: "Absolute path to the IRIX 5.3 boot .chd on the runner (blank = download from the IRIX53_DISK_URL secret)"
        required: false
        default: ""
      irix65_image:
        description: "Absolute path to the IRIX 6.5 boot .chd on the runner (blank = download from the IRIX65_DISK_URL secret)"
        required: false
        default: ""
      iris_tag:
        description: "iris release tag to use (blank = IRIS_TAG var or latest)"
        required: false
        default: ""
      build_o32:
        description: "Build the o32 (IRIX 5.3) flavor"
        type: boolean
        required: false
        default: true
      build_n32:
        description: "Build the n32 (IRIX 6.5) flavor"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

# One env block, inherited by every job: the scripts read exactly these
# variables whether exported here or in a developer's shell.
env:
  IRIX53_DISK_URL: ${{ secrets.IRIX53_DISK_URL }}
  IRIX65_DISK_URL: ${{ secrets.IRIX65_DISK_URL }}
  IRIX53_IMAGE: ${{ github.event.inputs.irix53_image }}
  IRIX65_IMAGE: ${{ github.event.inputs.irix65_image }}
  # Flavor switches: dispatch input > repo variable > on. The scripts read the
  # same BUILD_O32/BUILD_N32 names from ci/local.conf in local runs.
  BUILD_O32: ${{ github.event.inputs.build_o32 || vars.BUILD_O32 || 'true' }}
  BUILD_N32: ${{ github.event.inputs.build_n32 || vars.BUILD_N32 || 'true' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  # Fail in seconds, with the exact fix in the message, when an ENABLED flavor
  # has no image source (secret or local-path input); probe URLs warn-only.
  # Emits the enabled-flavor list that build-native's matrix is built from.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.m.outputs.flavors }}
    steps:
      - uses: actions/checkout@v4
      - name: Check image sources; compute the flavor matrix
        id: m
        run: |
          flavors=""
          for f in o32 n32; do
            if ./scripts/fetch-image.sh --flavor "$f" --enabled; then
              ./scripts/fetch-image.sh --flavor "$f" --check-only
              flavors="${flavors:+$flavors,}\"$f\""
            fi
          done
          [ -n "$flavors" ] || { echo "::error::both flavors are disabled (build_o32/build_n32)"; exit 1; }
          echo "flavors=[$flavors]" >> "$GITHUB_OUTPUT"
          echo "building: [$flavors]"

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date -u +%Y-%m-%d-%H-%M)" >> "$GITHUB_OUTPUT"
          fi

  # One job, two guests: o32 boots the 5.3 disk, n32 the 6.5 disk. Everything
  # flavor-specific lives in the scripts; the matrix only picks the flavor.
  build-native:
    needs: [version, preflight]
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.preflight.outputs.flavors) }}
    name: build-${{ matrix.flavor }}-native
    runs-on: ${{ github.event.inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries (Linux runners)
        if: runner.os == 'Linux'
        run: |
          # The prebuilt iris CLI links ALSA; unzip handles zipped disks/rb-cli.
          sudo apt-get update
          sudo apt-get install -y unzip curl libasound2t64 || sudo apt-get install -y libasound2

      - name: Fetch prebuilt iris + iris-ci
        run: |
          ./scripts/fetch-iris.sh --dir iris \
            --repo "${{ vars.IRIS_RELEASE_REPO || 'danifunker/iris' }}" \
            --tag  "${{ github.event.inputs.iris_tag || vars.IRIS_TAG || 'latest' }}"

      - name: Provide rb-cli
        id: rb
        run: echo "path=$(./scripts/ensure-rbcli.sh)" >> "$GITHUB_OUTPUT"

      - name: Compute disk cache key
        id: dk
        run: echo "key=$(./scripts/fetch-image.sh --flavor ${{ matrix.flavor }} --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache the boot disk download
        if: steps.dk.outputs.key != 'local'
        uses: actions/cache@v4
        with:
          path: guest-disk-${{ matrix.flavor }}.chd
          key: irix-${{ matrix.flavor }}-disk-${{ steps.dk.outputs.key }}

      - name: Obtain boot disk + native ${{ matrix.flavor }} build inside IRIS
        run: |
          IMG=$(./scripts/fetch-image.sh --flavor ${{ matrix.flavor }})
          ./scripts/iris-build.sh \
            --flavor ${{ matrix.flavor }} \
            --image "$IMG" \
            --iris-dir iris \
            --rb-cli "${{ steps.rb.outputs.path }}" \
            --no-package --fresh \
            --bin-out "irixscsitb-${{ matrix.flavor }}" \
            --gui-out "scsitbgui-${{ matrix.flavor }}"
          file "irixscsitb-${{ matrix.flavor }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: irix-${{ matrix.flavor }}
          # The GUI is best-effort (an image without Motif dev still yields the
          # CLI), hence warn rather than error.
          if-no-files-found: warn
          path: |
            irixscsitb-${{ matrix.flavor }}
            scsitbgui-${{ matrix.flavor }}

  package:
    needs: [version, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pattern + merge so a disabled flavor's absent artifact is no error.
      - uses: actions/download-artifact@v4
        with:
          pattern: irix-*
          merge-multiple: true
          path: dist
      - name: Build .iso + .hda + .tar.gz artifacts
        run: |
          RB=$(./scripts/ensure-rbcli.sh)
          ./scripts/package-dist.sh \
            --version "${{ needs.version.outputs.version }}" \
            --dir dist --rb-cli "$RB"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-images
          path: |
            dist/*.iso
            dist/*.hda
            dist/*.tar.gz

  release:
    needs: [version, build-native, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: irix-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dist-images
          path: dist
      - name: Create GitHub release
        run: |
          ./scripts/publish-release.sh \
            --version "${{ needs.version.outputs.version }}" \
            --dist dist \
            --repo "${{ github.repository }}"
