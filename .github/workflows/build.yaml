name: Build irixscsitb
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup environment
      run: sudo apt update && sudo apt install build-essential meson

    - name: Setup build
      run: meson setup build

    - name: Build
      run: meson compile -C build

    # Host-side smoke test against the mock SCSI bus (tests/mock_os.c): the
    # protocol + two-stage detection logic, no hardware or emulator needed.
    - name: Protocol smoke test (mock SCSI bus)
      run: make test
