name: Build irixscsitb

# The fast check, on every push to main and on every pull request: build the
# Linux CLI with the real Makefile and run the mock-bus protocol suite
# (`make test`). No IRIX here - that is release.yml, which also runs on every
# push to main but spends minutes in the emulator - so this is the job that
# says within a minute whether the tree still compiles under -std=c89 -Wall
# and whether detection, a command builder, a listing or the exit-status
# contract regressed.
#
# It used to run `meson setup && meson compile` and was switched to manual
# only when that stopped linking: meson.build never learned about version.c
# or the two generated headers (version.h / buildhost.h) that only the
# Makefile knows how to produce. The Makefile is the real build path on every
# platform, so CI now exercises exactly what people use; meson.build is
# unused by CI and unmaintained.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install a C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # Linux backend (linux.c, <scsi/sg.h>); version.h / buildhost.h are
      # stamped by the Makefile's own rules from the checked-out revision.
      - name: Build the Linux CLI with the Makefile
        run: make

      - name: Report build identification
        run: ./irixscsitb -version

      # Host-side smoke test against the mock SCSI bus (tests/mock_os.c):
      # detection, the command builders, Wi-Fi, listings, transfers and the
      # exit-status contract. No hardware or emulator needed.
      - name: Protocol smoke test (mock SCSI bus)
        run: make test
