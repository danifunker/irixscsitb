name: Build irixscsitb

# DISABLED - manual only. This was `on: [push]` and is currently BROKEN.
#
# WHY: the meson build does not know about version.c. `irixscsitb.c` calls
# build_revision() / build_stamp() / build_compiled() / build_abi() /
# build_libs(), all defined in version.c, and meson's `srcs` never gained it
# when version.c was added - so the link fails on five undefined symbols. It
# would also need the two generated headers (version.h, buildhost.h), which
# only the Makefile knows how to produce and which are deliberately gitignored.
#
# TWO WAYS BACK:
#   1. Teach meson about it: add 'version.c' to srcs plus custom_targets that
#      run scripts/mkversion.sh and emit buildhost.h.
#   2. Better - drop meson from CI and run `make` instead. The Makefile is the
#      real build path on every platform, already generates both headers, and
#      testing it means CI exercises what people actually use. `make test` would
#      then also run the mock-bus suite, which meson never did.
#
# Re-enable by restoring `on: [push]` once one of those is done.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup environment
      run: sudo apt update && sudo apt install build-essential meson

    - name: Setup build
      run: meson setup build

    - name: Build
      run: meson compile -C build

    # Host-side smoke test against the mock SCSI bus (tests/mock_os.c): the
    # protocol + two-stage detection logic, no hardware or emulator needed.
    - name: Protocol smoke test (mock SCSI bus)
      run: make test
