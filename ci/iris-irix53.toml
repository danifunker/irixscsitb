# ci/iris-irix53.toml — IRIS machine config for the headless CI build of irixscsitb.
#
# Boots an ALREADY-INSTALLED IRIX 5.3 system disk and exports a host directory
# over IRIS's built-in NFS server so scripts/iris-build.sh can drop the source in
# and read the compiled o32 binary back out — no scratch volume, no push/pull.
# (scripts/iris-build.sh passes --nfs-dir on the command line, which overrides
# the shared_dir below; this stanza is what makes a *manual* `iris --config
# ci/iris-irix53.toml` run export something too.)
#
# NETWORKING PREREQUISITE: NFS needs an IP inside the guest. The IRIS NAT hands
# out 192.168.0.2 via DHCP and answers NFS at the gateway 192.168.0.1 — but the
# guest must be configured to ask. Run scripts/irix-enable-dhcp.sh against the
# boot disk ONCE before first use.
#
# BASE DISK: any installed IRIX 5.3 system that has the developer option (IDO:
# cc, make, headers) so `make` works inside the guest, plus the Motif
# development environment if you want the GUI built too. Supply your own - no
# particular image is required or shipped here, and none is referenced by name.
# Point scsi.1.path at your .chd, or drop it next to wherever iris runs as
# `irix53.chd`. Paths here are relative to iris's working dir - use absolute
# paths if you run iris from elsewhere.

headless   = true                   # no window; --ci also renders offscreen
no_audio   = true
banks      = [128, 128, 0, 0]
nvram      = "nvram-irix53-ci.bin"  # iris seeds a default on first run
serial_log = "iris-ci-console.log"

# The installed IRIX 5.3 boot disk (supply your own; see above).
[scsi.1]
path  = "irix53.chd"
cdrom = false

# NFS export: host<->guest file transfer with nothing to install (in-core,
# pure-Rust NFS server; NFSv2 for 5.3, NFSv3 for 6.x, auto-negotiated). Mount it
# inside IRIX with:  mount 192.168.0.1:/ /mnt
[nfs]
shared_dir = "./ci-share"

# Old scratch-volume path (no longer used by iris-build.sh; kept commented as a
# no-networking fallback — guest sees it at /dev/rdsk/dks0d2s0). Uncomment to
# transfer files via `iris-ci push/pull` instead of NFS.
#[scsi.2]
#path    = "iris-ci-scratch.raw"
#cdrom   = false
#overlay = false
#scratch = true
#size_mb = 64
